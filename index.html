<script>
const STORAGE_ORDER = "biz_order_list";
const STORAGE_EXP = "biz_exp_list";
const STORAGE_PRESET = "biz_cat_preset";
let currentYm = "";
let editFullIndex = null; // 编辑订单的全局索引

function getOrders(){
const s=localStorage.getItem(STORAGE_ORDER);
return s?JSON.parse(s):[];
}
function saveOrders(arr){
localStorage.setItem(STORAGE_ORDER,JSON.stringify(arr));
}
function getExps(){
const s=localStorage.getItem(STORAGE_EXP);
return s?JSON.parse(s):[];
}
function saveExps(arr){
localStorage.setItem(STORAGE_EXP,JSON.stringify(arr));
}

// 智能字段提取：兼容各种可能的字段名
function extractField(obj, candidates){
    for(const key of candidates){
        if(obj[key] != null && obj[key] !== "") return obj[key];
    }
    return null;
}

// 把任意格式的旧订单对象转成统一格式
function normalizeOrder(o){
    const date = extractField(o, ["date","time","createdAt","日期","rq"]) || "";
    const cat = extractField(o, ["cat","category","type","name","分类","fl"]) || "";
    const costPrice = extractField(o, ["costPrice","拿货单价","cost_price"]);
    const sellPrice = extractField(o, ["sellPrice","售出单价","sell_price"]);
    const multiCnt = extractField(o, ["multiCnt","倍数","multi_cnt","hundredCnt"]);
    const calcCost = extractField(o, ["calcCost","cost","拿货成本","总成本","buyPrice","inputPrice","成本"]);
    const calcSell = extractField(o, ["calcSell","sell","amount","交易金额","卖出价","sellAmount","money","price","金额"]);
    const profit = extractField(o, ["profit","earnings","income","gain","利润","lr","netProfit"]);
    const note = extractField(o, ["note","remark","备注","bz","desc"]) || "";
    return {
        date: String(date),
        cat: String(cat),
        costPrice: costPrice != null ? Number(costPrice) : "",
        sellPrice: sellPrice != null ? Number(sellPrice) : "",
        multiCnt: multiCnt != null ? Number(multiCnt) : "",
        calcCost: calcCost != null ? Number(calcCost) : (costPrice && multiCnt ? Number(costPrice)*Number(multiCnt) : 0),
        calcSell: calcSell != null ? Number(calcSell) : (sellPrice && multiCnt ? Number(sellPrice)*Number(multiCnt) : 0),
        profit: profit != null ? Number(profit) : 0,
        note: String(note),
        _raw: o  // 保留原始数据，防止字段丢失
    };
}

function normalizeExp(e){
    const date = extractField(e, ["date","time","createdAt","日期","rq"]) || "";
    const cat = extractField(e, ["cat","category","type","name","分类","fl"]) || "";
    const money = extractField(e, ["money","amount","支出","金额","price","cost"]);
    const note = extractField(e, ["note","remark","备注","bz","desc"]) || "";
    return {
        date: String(date),
        cat: String(cat),
        money: money != null ? Number(money) : 0,
        note: String(note),
        _raw: e
    };
}

// 判断是不是订单数据
function isOrderData(arr){
    if(!Array.isArray(arr) || arr.length === 0) return false;
    const first = arr[0];
    if(!first || typeof first !== 'object') return false;
    const hasDate = !!extractField(first, ["date","time","createdAt","日期","rq"]);
    const hasCat = !!extractField(first, ["cat","category","type","name","分类","fl"]);
    const hasProfit = extractField(first, ["profit","earnings","income","gain","利润","lr","netProfit"]) != null;
    const hasSell = extractField(first, ["calcSell","sell","amount","交易金额","卖出价","sellAmount","money","price","金额"]) != null;
    const hasCost = extractField(first, ["calcCost","cost","拿货成本","总成本","buyPrice","inputPrice","成本"]) != null;
    // 有日期+分类，并且有利润/卖出/成本之一，认为是订单
    return hasDate && hasCat && (hasProfit || hasSell || hasCost);
}

function isExpData(arr){
    if(!Array.isArray(arr) || arr.length === 0) return false;
    const first = arr[0];
    if(!first || typeof first !== 'object') return false;
    const hasDate = !!extractField(first, ["date","time","createdAt","日期","rq"]);
    const hasCat = !!extractField(first, ["cat","category","type","name","分类","fl"]);
    const hasMoney = extractField(first, ["money","amount","支出","金额","price","cost"]) != null;
    const hasProfit = extractField(first, ["profit","earnings","income","利润"]) != null;
    // 支出：有日期分类金额，但没有利润字段（有利润的算订单）
    return hasDate && hasCat && hasMoney && !hasProfit;
}

// 扫描所有存储
function scanStorage(){
    const results = [];
    for(let i=0; i<localStorage.length; i++){
        const key = localStorage.key(i);
        if(!key) continue;
        if(key === STORAGE_ORDER || key === STORAGE_EXP || key === STORAGE_PRESET) continue;
        const val = localStorage.getItem(key);
        if(!val) continue;
        let parsed = null;
        try{ parsed = JSON.parse(val); }catch(e){ continue; }
        if(!Array.isArray(parsed)) continue;
        let type = "未知数组";
        if(isOrderData(parsed)) type = "订单数据";
        else if(isExpData(parsed)) type = "支出数据";
        results.push({
            key: key,
            count: parsed.length,
            type: type,
            sample: parsed.slice(0, 3),
            raw: parsed
        });
    }
    return results;
}

// 诊断显示
function runDiagnose(){
    const box = document.getElementById("diagnoseBox");
    box.classList.add("show");
    const currentOrders = getOrders();
    const currentExps = getExps();
    let html = `<div class="storage-item"><h4>📦 当前订单存储 (${STORAGE_ORDER}) - ${currentOrders.length}条</h4>`;
    if(currentOrders.length > 0){
        html += `<pre>${JSON.stringify(currentOrders.slice(0,3), null, 2)}</pre>`;
    }else{
        html += `<pre>（空）</pre>`;
    }
    html += `</div>`;
    html += `<div class="storage-item"><h4>📦 当前支出存储 (${STORAGE_EXP}) - ${currentExps.length}条</h4>`;
    if(currentExps.length > 0){
        html += `<pre>${JSON.stringify(currentExps.slice(0,3), null, 2)}</pre>`;
    }else{
        html += `<pre>（空）</pre>`;
    }
    html += `</div>`;

    const others = scanStorage();
    if(others.length === 0){
        html += `<div class="storage-item"><h4>没有检测到其他存储数据</h4></div>`;
    }else{
        others.forEach(item => {
            html += `<div class="storage-item"><h4>🔍 [${item.key}] - ${item.count}条 - 识别为：${item.type}</h4>`;
            html += `<pre>${JSON.stringify(item.sample, null, 2)}</pre>`;
            html += `</div>`;
        });
    }
    box.innerHTML = html;
}

// 一键迁移（不删除原数据）
function doMigrate(){
    const others = scanStorage();
    if(others.length === 0){
        alert("没有检测到可迁移的旧数据");
        return;
    }
    let orderAdded = 0, expAdded = 0;
    const existingOrders = getOrders();
    const existingExps = getExps();

    others.forEach(item => {
        if(item.type === "订单数据"){
            const converted = item.raw.map(normalizeOrder);
            const filtered = converted.filter(c => !existingOrders.some(e =>
                e.date === c.date && e.cat === c.cat &&
                Number(e.calcSell||0) === Number(c.calcSell) &&
                Number(e.profit||0) === Number(c.profit)
            ));
            if(filtered.length > 0){
                saveOrders([...existingOrders, ...filtered]);
                orderAdded += filtered.length;
            }
        }else if(item.type === "支出数据"){
            const converted = item.raw.map(normalizeExp);
            const filtered = converted.filter(c => !existingExps.some(e =>
                e.date === c.date && e.cat === c.cat && Number(e.money||0) === Number(c.money)
            ));
            if(filtered.length > 0){
                saveExps([...existingExps, ...filtered]);
                expAdded += filtered.length;
            }
        }
    });

    alert(`迁移完成：订单迁入 ${orderAdded} 条，支出迁入 ${expAdded} 条\n原数据未删除，可再次扫描确认。`);
    renderStat();
    runDiagnose();
}

function getCatPreset(){
    const s = localStorage.getItem(STORAGE_PRESET);
    return s ? JSON.parse(s) : {"话费":{cost:"",sell:""},"电费":{cost:"",sell:""},"燃气":{cost:"",sell:""}};
}
function saveCatPreset(obj){
    localStorage.setItem(STORAGE_PRESET, JSON.stringify(obj));
}

function loadCurrentCatPreset(){
    const cat = document.getElementById("orderCat").value;
    const preset = getCatPreset();
    if(preset[cat]){
        document.getElementById("costPrice").value = preset[cat].cost;
        document.getElementById("sellPrice").value = preset[cat].sell;
        recalcAll();
    }
    if(cat==="话费"){
        document.getElementById("preCostPhone").value=preset.话费.cost;
        document.getElementById("preSellPhone").value=preset.话费.sell;
    }else if(cat==="电费"){
        document.getElementById("preCostElec").value=preset.电费.cost;
        document.getElementById("preSellElec").value=preset.电费.sell;
    }else if(cat==="燃气"){
        document.getElementById("preCostGas").value=preset.燃气.cost;
        document.getElementById("preSellGas").value=preset.燃气.sell;
    }
}

const multiSel = document.getElementById("multiCnt");
for(let i=1;i<=30;i++){
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = i;
    multiSel.appendChild(opt);
}

// 编辑弹窗倍数下拉
const editMultiSel = document.getElementById("editMultiCnt");
for(let i=1;i<=30;i++){
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = i;
    editMultiSel.appendChild(opt);
}

const collapseHead = document.getElementById("collapseHead");
const collapseBody = document.getElementById("collapseBody");
collapseHead.onclick = ()=>{
    collapseBody.classList.toggle("open");
    collapseHead.innerText = collapseBody.classList.contains("open") ? "▼ 分类默认成本预设（点击收起）":"▶ 分类默认成本预设（点击展开）";
}

document.querySelectorAll(".btn-save-preset").forEach(btn=>{
    btn.onclick=()=>{
        const key = btn.dataset.key;
        const preset = getCatPreset();
        if(key==="话费"){
            preset.话费.cost = document.getElementById("preCostPhone").value;
            preset.话费.sell = document.getElementById("preSellPhone").value;
        }else if(key==="电费"){
            preset.电费.cost = document.getElementById("preCostElec").value;
            preset.电费.sell = document.getElementById("preSellElec").value;
        }else if(key==="燃气"){
            preset.燃气.cost = document.getElementById("preCostGas").value;
            preset.燃气.sell = document.getElementById("preSellGas").value;
        }
        saveCatPreset(preset);
        loadCurrentCatPreset();

    }

document.getElementById("orderCat").onchange = loadCurrentCatPreset;
document.getElementById("diagnoseBtn").onclick = runDiagnose;
document.getElementById("migrateBtn").onclick = doMigrate;

function getNowYm(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getTodayStr(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
tab.classList.add("active");
const pg=tab.dataset.page;
document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
document.getElementById(pg).classList.add("show");
if(pg==="pageStat") renderStat();
}
})

const orderDate=document.getElementById("orderDate");
const orderCat=document.getElementById("orderCat");
const costPriceIn=document.getElementById("costPrice");
const sellPriceIn=document.getElementById("sellPrice");
const multiCntIn=document.getElementById("multiCnt");
const calcCostOut=document.getElementById("calcCost");
const calcSellOut=document.getElementById("calcSell");
const profitIn=document.getElementById("profit");
const noteIn=document.getElementById("note");
orderDate.value=getTodayStr();
loadCurrentCatPreset();

function recalcAll(){
const costPrice=Number(costPriceIn.value||0);
const sellPrice=Number(sellPriceIn.value||0);
const cnt=Number(multiCntIn.value||0);
const realCost=costPrice*cnt;
const realSell=sellPrice*cnt;
calcCostOut.value=realCost.toFixed(2);
calcSellOut.value=realSell.toFixed(2);
profitIn.value=(realSell-realCost).toFixed(2);
}
costPriceIn.oninput=recalcAll;
sellPriceIn.oninput=recalcAll;
multiCntIn.onchange=recalcAll;

//编辑弹窗计算
const editCostPrice=document.getElementById("editCostPrice");
const editSellPrice=document.getElementById("editSellPrice");
const editMultiCnt=document.getElementById("editMultiCnt");
const editCalcCost=document.getElementById("editCalcCost");
const editCalcSell=document.getElementById("editCalcSell");
const editProfit=document.getElementById("editProfit");
function recalcEdit(){
    const cp=Number(editCostPrice.value||0);
    const sp=Number(editSellPrice.value||0);
    const cnt=Number(editMultiCnt.value||0);
    const rc=cp*cnt;
    const rs=sp*cnt;
    editCalcCost.value=rc.toFixed(2);
    editCalcSell.value=rs.toFixed(2);
    editProfit.value=(rs-rc).toFixed(2);
}
editCostPrice.oninput=recalcEdit;
editSellPrice.oninput=recalcEdit;
editMultiCnt.onchange=recalcEdit;

//关闭编辑弹窗
document.getElementById("closeEditModal").onclick = ()=>{
    document.getElementById("editModal").classList.remove("show");
    editFullIndex=null;
}

//保存编辑
document.getElementById("saveEditBtn").onclick=()=>{
    const date=document.getElementById("editDate").value;
    const cat=document.getElementById("editCat").value;
    const cp=Number(editCostPrice.value);
    const sp=Number(editSellPrice.value);
    const cnt=Number(editMultiCnt.value);
    const pf=Number(editProfit.value||0);
    const nt=document.getElementById("editNote").value.trim();
    if(!date||isNaN(cp)||isNaN(sp)||isNaN(cnt)||cnt<1||cnt>30){
        alert("请填写完整，倍数范围1‑30");
        return;
    }
    const arr = getOrders();
    arr[editFullIndex]={
        date,cat,
        costPrice:cp,
        sellPrice:sp,
        multiCnt:cnt,
        calcCost:cp*cnt,
        calcSell:sp*cnt,
        profit:pf,
        note:nt
    };
    saveOrders(arr);
    document.getElementById("editModal").classList.remove("show");
    editFullIndex=null;
    renderStat();
    alert("订单修改保存成功！");
}

document.getElementById("addBtn").onclick=()=>{
const costPrice=Number(costPriceIn.value);
const sellPrice=Number(sellPriceIn.value);
const multiCnt=Number(multiCntIn.value);
if(!orderDate.value||isNaN(costPrice)||isNaN(sellPrice)||isNaN(multiCnt)||multiCnt<1||multiCnt>30){
alert("请填写完整，倍数范围1‑30");
return;
}
const rec={
date:orderDate.value,
cat:orderCat.value,
costPrice:costPrice,
sellPrice:sellPrice,
multiCnt:multiCnt,
calcCost:costPrice*multiCnt,
calcSell:sellPrice*multiCnt,
profit:Number(profitIn.value||0),
note:noteIn.value.trim()
}
const arr=getOrders();
arr.push(rec);
saveOrders(arr);
resetOrderForm();
alert("已保存");
renderStat();
}

function resetOrderForm(){
orderDate.value=getTodayStr();
costPriceIn.value="";
sellPriceIn.value="";
multiCntIn.value=1;
calcCostOut.value="";
calcSellOut.value="";
profitIn.value="";
noteIn.value="";
loadCurrentCatPreset();
}
document.getElementById("resetForm").onclick=resetOrderForm;

const expDate=document.getElementById("expDate");
const expCat=document.getElementById("expCat");
const expMoney=document.getElementById("expMoney");
const expNote=document.getElementById("expNote");
expDate.value=getTodayStr();
document.getElementById("addExpBtn").onclick=()=>{
const m=Number(expMoney.value);
if(!expDate.value||isNaN(m)){alert("填写支出金额");return}
saveExps([...getExps(),{date:expDate.value,cat:expCat.value,money:m,note:expNote.value.trim()}]);
resetExpForm();alert("支出已保存");renderStat();
}
function resetExpForm(){expDate.value=getTodayStr();expMoney.value="";expNote.value=""}
document.getElementById("resetExpForm").onclick=resetExpForm;

function parseYm(ym){
const [y,m]=ym.split("-").map(Number);return {y,m};
}
function ymAdd(ym,off){
let {y,m}=parseYm(ym);m+=off;
if(m>12){m=1;y+=1}
if(m<1){m=12;y-=1}
return `${y}-${String(m).padStart(2,'0')}`;
}
document.getElementById("prevMonth").onclick=()=>{currentYm=ymAdd(currentYm,-1);renderStat()}
document.getElementById("nextMonth").onclick=()=>{currentYm=ymAdd(currentYm,1);renderStat()}
document.getElementById("resetFilter").onclick=()=>{document.getElementById("filterCat").value="";renderStat()}

function renderStat(){
if(!currentYm) currentYm=getNowYm();
document.getElementById("monthText").innerText=currentYm;
const filterCat=document.getElementById("filterCat").value;
let orders=getOrders().filter(o=>o.date.startsWith(currentYm));
let exps=getExps().filter(e=>e.date.startsWith(currentYm));

//筛选逻辑
if(filterCat){
  if(filterCat==="日常支出"){
    orders=[];
  }else{
    exps=[];
    orders=orders.filter(o=>o.cat===filterCat);
  }
}

let totalSell=0,totalProfit=0;
orders.forEach(o=>{
    totalSell += Number(o.calcSell != null ? o.calcSell : (o.sell || 0));
    totalProfit += Number(o.profit || 0);
})
let totalExp=0;
exps.forEach(e=>totalExp+=Number(e.money||0));

document.getElementById("totalCount").innerText=orders.length;
document.getElementById("totalSell").innerText=totalSell.toFixed(2);
document.getElementById("totalProfit").innerText=totalProfit.toFixed(2);
document.getElementById("netIncome").innerText=(totalProfit-totalExp).toFixed(2);

const tb=document.getElementById("tableBody");
tb.innerHTML="";

//渲染业务订单
orders.forEach((item,idx)=>{
const costPrice = item.costPrice ? Number(item.costPrice).toFixed(2) : "-";
const sellPrice = item.sellPrice ? Number(item.sellPrice).toFixed(2) : "-";
const multiCnt = item.multiCnt || "-";
const calcCost = Number(item.calcCost != null ? item.calcCost : (item.cost || 0)).toFixed(2);
const calcSell = Number(item.calcSell != null ? item.calcSell : (item.sell || 0)).toFixed(2);
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${item.date}</td>
<td>业务订单</td>
<td>${item.cat}</td>
<td>${costPrice}</td>
<td>${sellPrice}</td>
<td>${multiCnt}</td>
<td>${calcCost}</td>
<td>${calcSell}</td>
<td>${Number(item.profit||0).toFixed(2)}</td>
<td>${item.note||""}</td>
<td><button class="btn-edit" data-fullidx="${getOrders().findIndex(x=>x.date===item.date&&x.cat===item.cat&&Number(x.calcSell||0)===Number(item.calcSell||0))}">编辑</button> <button class="btn-del" data-type="order" data-idx="${idx}">删除</button></td>`;
tb.appendChild(tr);
})

//渲染日常支出（粉色底色区分）
exps.forEach((item,idx)=>{
const tr=document.createElement("tr");
tr.className="tr-exp";
tr.innerHTML=`
<td>${item.date}</td>
<td>日常支出</td>
<td>${item.cat}</td>
<td>-</td>
<td>-</td>
<td>-</td>
<td>${Number(item.money).toFixed(2)}</td>
<td>-</td>
<td>-</td>
<td>${item.note||""}</td>
<td><button class="btn-del" data-type="exp" data-idx="${idx}">删除</button></td>`;
tb.appendChild(tr);
})

//编辑按钮事件
tb.querySelectorAll(".btn-edit").forEach(b=>{
    b.onclick=()=>{
        const fidx = Number(b.dataset.fullidx);
        editFullIndex = fidx;
        const o = getOrders()[fidx];
        document.getElementById("editDate").value = o.date;
        document.getElementById("editCat").value = o.cat;
        document.getElementById("editCostPrice").value = o.costPrice;
        document.getElementById("editSellPrice").value = o.sellPrice;
        document.getElementById("editMultiCnt").value = o.multiCnt;
        document.getElementById("editNote").value = o.note || "";
        recalcEdit();
        document.getElementById("editModal").classList.add("show");
    }
})

//删除按钮逻辑，区分订单/支出
tb.querySelectorAll(".btn-del").forEach(b=>{
b.onclick=()=>{
  const delType = b.dataset.type;
  const realIdx=Number(b.dataset.idx);
  if(delType === "order"){
    const monthList=getOrders().filter(o=>o.date.startsWith(currentYm));
    const target=monthList[realIdx];
    const fullIdx=getOrders().findIndex(x=>x.date===target.date&&x.cat===target.cat&&Number(x.calcSell||0)===Number(target.calcSell||0));
    if(fullIdx>-1){
      const arr=getOrders();arr.splice(fullIdx,1);saveOrders(arr);renderStat();
    }
  }else{
    const monthList=getExps().filter(e=>e.date.startsWith(currentYm));
    const target=monthList[realIdx];
    const fullIdx=getExps().findIndex(x=>x.date===target.date&&x.cat===target.cat&&Number(x.money||0)===Number(target.money||0));
    if(fullIdx>-1){
      const arr=getExps();arr.splice(fullIdx,1);saveExps(arr);renderStat();
    }
  }
}
})
}

document.getElementById("exportBtn").onclick=()=>{
const arr=getOrders();
let csv="\uFEFF日期,分类,拿货单价,售出单价,倍数,拿货总成本,交易金额,利润,备注\n";
arr.forEach(r=>{
    const costPrice = r.costPrice || "";
    const sellPrice = r.sellPrice || "";
    const multiCnt = r.multiCnt || "";
    const calcCost = r.calcCost != null ? r.calcCost : (r.cost || 0);
    const calcSell = r.calcSell != null ? r.calcSell : (r.sell || 0);
    csv+=`${r.date},${r.cat},${costPrice},${sellPrice},${multiCnt},${calcCost},${calcSell},${r.profit},"${r.note||""}"\n`;
});
const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="记账本.csv";
a.click();
}

document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=async e=>{
const f=e.target.files[0];if(!f)return;
const text=await f.text();
const lines=text.split(/\r?\n/).filter(x=>x.trim());
for(let i=1;i<lines.length;i++){
const row=lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
if(!row||row.length<9)continue;
const rec={
date:row[0].trim(),
cat:row[1].trim(),
costPrice:row[2].trim()?Number(row[2]):"",
sellPrice:row[3].trim()?Number(row[3]):"",
multiCnt:row[4].trim()?Number(row[4]):"",
calcCost:Number(row[5]),
calcSell:Number(row[6]),
profit:Number(row[7]),
note:(row[8]||"").replace(/"/g,"").trim()
}
saveOrders([...getOrders(),rec]);
}
alert("导入完成");renderStat();
}

//双层二次确认清空全部
document.getElementById("clearAll").onclick=()=>{
    if(confirm("⚠️警告！即将清空【所有订单+所有支出记录】，建议先导出CSV备份！确定继续吗？")){
        if(confirm("❗最终确认！一旦删除数据无法恢复，真的要全部清空吗？")){
            saveOrders([]);
            saveExps([]);
            renderStat();
            alert("全部记录已清空");
        }
    }
}

document.getElementById("filterCat").onchange=renderStat;
currentYm=getNowYm();
renderStat();
</script>
